<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 카드함</title>
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FBFAF5;
    --room:#E7EAE1;
    --ink:#232A21;
    --ink-soft:#5C6355;
    --seal:#B0402B;
    --shelf:#41573F;
    --rule:#CDD2C4;
    --serif:'Noto Serif KR', serif;
    --sans:'IBM Plex Sans KR', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--room);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:80px;
  }
  header{
    background:var(--shelf);
    color:var(--paper);
    padding:28px 20px 24px;
    text-align:center;
    border-bottom:4px double rgba(251,250,245,.4);
    position:relative;
  }
  header h1{font-family:var(--serif); font-weight:900; font-size:1.7rem; letter-spacing:.12em;}
  header p{font-size:.82rem; opacity:.75; margin-top:6px; letter-spacing:.05em;}
  #logoutBtn{
    position:absolute; top:14px; right:14px;
    background:transparent; color:var(--paper);
    border:1px solid rgba(251,250,245,.5);
    font-size:.75rem; padding:5px 10px;
  }
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px;}

  /* ── 탭 ── */
  .tabs{display:flex; gap:0; margin-bottom:18px; border-bottom:2px solid var(--rule);}
  .tabs button{
    border:none; background:none; border-radius:0;
    padding:10px 18px; font-size:.92rem; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .tabs button.on{
    color:var(--ink); font-weight:600;
    border-bottom-color:var(--seal);
  }
  .tabs button:hover{transform:none;}

  /* ── 툴바 ── */
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .toolbar input[type=search]{
    flex:1; min-width:160px; padding:10px 14px;
    border:1.5px solid var(--rule); border-radius:6px;
    background:var(--paper); font:inherit; font-size:.9rem;
  }
  .toolbar input[type=search]:focus{outline:2px solid var(--shelf); outline-offset:1px;}
  button{
    font:inherit; cursor:pointer; border-radius:6px;
    padding:10px 16px; border:1.5px solid var(--ink);
    background:var(--paper); color:var(--ink); font-weight:600; font-size:.88rem;
    transition:transform .08s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:focus-visible{outline:2px solid var(--seal); outline-offset:2px;}
  button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  button.danger{border-color:var(--seal); color:var(--seal);}
  button.ghost{border-color:var(--rule); color:var(--ink-soft);}
  button:disabled{opacity:.5; cursor:wait; transform:none;}

  .filters{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .filters button{padding:6px 12px; font-size:.8rem; border-color:var(--rule); color:var(--ink-soft);}
  .filters button.on{background:var(--shelf); color:var(--paper); border-color:var(--shelf);}
  .filters select{
    padding:6px 10px; font:inherit; font-size:.8rem;
    border:1.5px solid var(--rule); border-radius:6px; background:var(--paper); color:var(--ink-soft);
  }

  /* ── 카드 목록 ── */
  .cards{display:grid; gap:14px;}
  .card{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:18px 20px 16px;
    position:relative;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(35,42,33,.08), 0 3px 8px rgba(35,42,33,.06);
    background-image:repeating-linear-gradient(transparent, transparent 27px, rgba(205,210,196,.55) 27px, rgba(205,210,196,.55) 28px);
  }
  .card:hover{box-shadow:0 2px 0 rgba(35,42,33,.1), 0 6px 14px rgba(35,42,33,.12);}
  .card .callno{
    font-size:.68rem; letter-spacing:.18em; color:var(--ink-soft);
    text-transform:uppercase; margin-bottom:6px;
    display:flex; justify-content:space-between;
  }
  .card h3{font-family:var(--serif); font-weight:700; font-size:1.12rem; line-height:1.45;}
  .card .meta{font-size:.82rem; color:var(--ink-soft); margin-top:4px;}
  .card .oneline{font-size:.88rem; margin-top:10px; line-height:1.6;}
  .who{
    display:inline-block; font-size:.72rem; font-weight:600;
    color:var(--shelf); background:rgba(65,87,63,.1);
    padding:2px 8px; border-radius:99px; margin-top:8px;
  }
  .stamp{
    position:absolute; top:14px; right:14px;
    width:52px; height:52px; border:2.5px solid var(--seal); border-radius:50%;
    color:var(--seal); font-family:var(--serif); font-weight:900;
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; letter-spacing:.05em;
    transform:rotate(-12deg); opacity:.85;
    background:rgba(176,64,43,.04);
  }
  .stars{color:var(--seal); letter-spacing:2px; font-size:.85rem; margin-top:6px;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    border:1.5px dashed var(--rule); border-radius:8px; background:rgba(251,250,245,.5);
    line-height:1.8; font-size:.92rem;
  }

  /* ── 폼 / 상세 / 로그인 ── */
  .sheet{
    background:var(--paper); border:1px solid var(--rule); border-radius:4px;
    padding:26px 24px; box-shadow:0 4px 16px rgba(35,42,33,.1);
  }
  .sheet h2{font-family:var(--serif); font-weight:900; font-size:1.25rem; margin-bottom:4px;}
  .sheet .sub{font-size:.8rem; color:var(--ink-soft); margin-bottom:20px; line-height:1.6;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:.75rem; font-weight:600; letter-spacing:.1em;
    color:var(--shelf); margin-bottom:6px; text-transform:uppercase;
  }
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; font:inherit; font-size:.92rem;
    border:1.5px solid var(--rule); border-radius:6px; background:#fff;
  }
  .field textarea{min-height:88px; resize:vertical; line-height:1.7;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--shelf); outline-offset:1px;}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.row{grid-template-columns:1fr;}}
  .rating-pick{display:flex; gap:6px;}
  .rating-pick button{
    border:none; background:none; font-size:1.5rem; padding:2px;
    color:var(--rule); line-height:1;
  }
  .rating-pick button.on{color:var(--seal);}
  .quote-list{display:grid; gap:8px; margin-bottom:8px;}
  .quote-item{display:flex; gap:8px; align-items:flex-start;}
  .quote-item textarea{flex:1; min-height:44px !important; overflow:hidden;}
  .quote-item .pg{width:76px; flex:none;}
  .actions{display:flex; gap:8px; margin-top:22px; flex-wrap:wrap;}

  /* ── 질문 안내 상자 ── */
  .hint{
    font-size:.78rem; color:var(--ink-soft); line-height:1.7;
    background:rgba(65,87,63,.06); border-left:3px solid var(--shelf);
    padding:8px 12px; border-radius:0 6px 6px 0; margin-bottom:8px;
  }
  .field textarea{overflow:hidden;}
  .check{display:flex; align-items:center; gap:8px; font-size:.88rem; margin-bottom:16px;}
  .check input{width:18px; height:18px; accent-color:var(--shelf);}

  /* ── 로그인 / 닉네임 ── */
  #viewAuth, #viewNick{max-width:400px; margin:40px auto 0;}
  .social-divider{
    display:flex; align-items:center; gap:10px; margin:18px 0 12px;
    font-size:.75rem; color:var(--ink-soft);
  }
  .social-divider::before, .social-divider::after{
    content:''; flex:1; height:1px; background:var(--rule);
  }
  .social-btns{display:grid; gap:8px;}
  button.social{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; font-size:.88rem;
  }
  button.social.google{background:#fff; border-color:var(--rule);}
  button.social.kakao{background:#FEE500; border-color:#FEE500; color:#191919;}
  .auth-msg{
    font-size:.82rem; margin-top:12px; line-height:1.6; padding:10px 12px;
    border-radius:6px; display:none;
  }
  .auth-msg.err{display:block; background:rgba(176,64,43,.08); color:var(--seal);}
  .auth-msg.ok{display:block; background:rgba(65,87,63,.1); color:var(--shelf);}

  /* ── 상세 보기 ── */
  .detail blockquote{
    border-left:3px solid var(--seal); padding:6px 0 6px 14px;
    margin:10px 0; font-family:var(--serif); line-height:1.8; font-size:.95rem;
  }
  .detail blockquote .pg{font-size:.75rem; color:var(--ink-soft); font-family:var(--sans);}
  .detail .section-label{
    font-size:.72rem; font-weight:600; letter-spacing:.14em; color:var(--shelf);
    text-transform:uppercase; margin:20px 0 6px; padding-bottom:4px;
    border-bottom:1px solid var(--rule);
  }
  .detail p{line-height:1.8; font-size:.94rem; white-space:pre-wrap;}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tags span{
    font-size:.75rem; padding:3px 10px; border-radius:99px;
    background:rgba(65,87,63,.1); color:var(--shelf); font-weight:500;
  }
  .footer-tools{display:flex; gap:8px; justify-content:center; margin-top:32px; flex-wrap:wrap;}
  .footer-tools button{font-size:.78rem; padding:7px 12px;}
  .notice{text-align:center; font-size:.75rem; color:var(--ink-soft); margin-top:14px; line-height:1.6;}
  .hidden{display:none;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  /* ── 인쇄: 카드 내용만 종이에 출력 ── */
  @media print{
    body{background:#fff; padding:0;}
    header, .actions, #logoutBtn{display:none !important;}
    .wrap{max-width:none; padding:0;}
    #viewDetail .sheet{border:none; box-shadow:none; padding:0;}
    .detail blockquote{page-break-inside:avoid;}
  }
</style>
</head>
<body>

<header>
  <h1>독서 카드함</h1>
  <p>읽고 · 적고 · 남긴다</p>
  <button id="logoutBtn" class="hidden" onclick="logout()">로그아웃</button>
</header>

<div class="wrap">

  <!-- 로그인 화면 -->
  <div id="viewAuth">
    <div class="sheet">
      <h2>서재 열기</h2>
      <p class="sub">이메일로 로그인하면 어느 기기에서든 같은 기록을 볼 수 있습니다.<br>처음이라면 같은 칸에 입력하고 「회원가입」을 누르세요.</p>
      <div class="field"><label for="authEmail">이메일</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="authPw">비밀번호 (6자 이상)</label><input id="authPw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="actions">
        <button class="primary" id="loginBtn" onclick="login()">로그인</button>
        <button id="signupBtn" onclick="signup()">회원가입</button>
      </div>
      <div class="social-divider"><span>또는</span></div>
      <div class="social-btns">
        <button class="social google" onclick="socialLogin('google')">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          구글로 로그인
        </button>
        <button class="social kakao" onclick="socialLogin('kakao')">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.54 2 10.9c0 2.8 1.86 5.26 4.66 6.65-.2.76-.75 2.78-.86 3.21-.13.53.2.52.41.38.17-.11 2.65-1.8 3.72-2.53.66.1 1.35.15 2.07.15 5.52 0 10-3.54 10-7.86C22 6.54 17.52 3 12 3z"/></svg>
          카카오로 로그인
        </button>
      </div>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <!-- 닉네임 설정 화면 -->
  <div id="viewNick" class="hidden">
    <div class="sheet">
      <h2>이름표 만들기</h2>
      <p class="sub">「모두의 서재」에서 다른 사람에게 보일 닉네임을 정해주세요.<br>나중에 언제든 바꿀 수 있습니다.</p>
      <div class="field"><label for="nickInput">닉네임</label><input id="nickInput" maxlength="20" placeholder="예: 책벌레"></div>
      <div class="actions">
        <button class="primary" onclick="saveNick()">저장</button>
      </div>
      <div class="auth-msg" id="nickMsg"></div>
    </div>
  </div>

  <!-- 목록 화면 -->
  <div id="viewList" class="hidden">
    <div class="tabs">
      <button id="tabMine" class="on" onclick="switchTab('mine')">내 서재</button>
      <button id="tabAll" onclick="switchTab('all')">모두의 서재</button>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="제목·저자·태그 검색" aria-label="검색">
      <button class="primary" id="newBtn" onclick="openForm()">＋ 새 카드</button>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="on">전체</button>
      <button data-f="reading">읽는 중</button>
      <button data-f="done">완독</button>
      <select id="typeFilter" aria-label="자료 유형 필터">
        <option value="">모든 유형</option>
        <option>책</option><option>논문</option><option>기타</option>
      </select>
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty hidden" id="emptyMsg"></div>
    <div class="footer-tools" id="footerTools">
      <button class="ghost" onclick="exportJSON()">JSON 내보내기</button>
      <button class="ghost" onclick="document.getElementById('importFile').click()">JSON 가져오기</button>
      <button class="ghost" onclick="openNick()">닉네임 변경</button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
    </div>
    <p class="notice">기록은 Supabase 데이터베이스에 저장되어 모든 기기에서 동기화됩니다.</p>
  </div>

  <!-- 작성/수정 화면 -->
  <div id="viewForm" class="hidden">
    <div class="sheet">
      <h2 id="formTitle">새 카드 작성</h2>
      <p class="sub">필수 항목은 제목뿐입니다. 나머지는 필요한 만큼만 적으면 됩니다.</p>

      <div class="field">
        <label for="fType">자료 유형</label>
        <select id="fType" onchange="applyTypeLabels()">
          <option>책</option><option>논문</option><option>기타</option>
        </select>
      </div>
      <div class="field"><label for="fTitle">제목 *</label><input id="fTitle" placeholder="예: 데미안 / 논문 제목"></div>
      <div class="row">
        <div class="field"><label for="fAuthor">저자</label><input id="fAuthor" placeholder="예: 헤르만 헤세 / 제1저자"></div>
        <div class="field"><label for="fCategory">분야</label><input id="fCategory" placeholder="예: 소설, 생물학, 학술지 이름"></div>
      </div>
      <div class="row">
        <div class="field"><label for="fStart">읽기 시작</label><input id="fStart" type="date"></div>
        <div class="field"><label for="fEnd" id="lblEnd">완독일 (비우면 ‘읽는 중’)</label><input id="fEnd" type="date"></div>
      </div>
      <div class="field">
        <label>별점</label>
        <div class="rating-pick" id="ratingPick" role="radiogroup" aria-label="별점"></div>
      </div>

      <div id="deepSections"></div>

      <div class="field">
        <label>인상 깊은 문장</label>
        <div class="quote-list" id="quoteList"></div>
        <button class="ghost" type="button" onclick="addQuoteRow()">＋ 문장 추가</button>
      </div>

      <div class="field"><label for="fTags">태그 (쉼표로 구분)</label><input id="fTags" placeholder="예: 성장, 2026, 스터디"></div>

      <label class="check">
        <input type="checkbox" id="fPublic" checked>
        모두의 서재에 공개 (끄면 나만 볼 수 있어요)
      </label>

      <div class="actions">
        <button class="primary" id="saveBtn" onclick="saveCard()">저장</button>
        <button class="ghost" onclick="showList()">취소</button>
      </div>
    </div>
  </div>

  <!-- 상세 화면 -->
  <div id="viewDetail" class="hidden">
    <div class="sheet detail" id="detailBody"></div>
    <div class="actions" id="detailActions">
      <button onclick="openForm(currentId)">수정</button>
      <button class="ghost" onclick="window.print()">인쇄</button>
      <button class="danger" onclick="deleteCard()">삭제</button>
      <button class="ghost" onclick="showList()">← 목록으로</button>
    </div>
    <div class="actions hidden" id="detailActionsReadonly">
      <button class="ghost" onclick="window.print()">인쇄</button>
      <button class="ghost" onclick="showList()">← 목록으로</button>
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════════════════
   ① 본인의 Supabase 값 (기존 index.html의 값을 그대로)
   ════════════════════════════════════════════ */
const SUPABASE_URL = 'https://gugsspjjcjggybooqiif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1Z3NzcGpqY2pnZ3lib29xaWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTkzMTksImV4cCI6MjEwMDg5NTMxOX0.NqZMFk6hYoH4rl9Qf6zJzBgyBfL6myHxLuv4sscLclo';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ── 유형별 질문 라벨과 안내 ──
   폼에 표시되는 항목: core → gap → method → thoughts → validity → group
   counter/summary/oneline은 예전 버전 데이터 표시용으로만 남겨둠 */
const FORM_KEYS = ['core','gap','method','thoughts','validity','group'];
const META = {
  '책': {
    stamp:'완독', endLabel:'완독일 (비우면 ‘읽는 중’)',
    core:    {label:'핵심질문과 저자의 답',      hint:'저자가 답하려는 중심 질문은? 에세이라면 글의 목적이나 의도, 소설이라면 작가가 이 이야기로 말하려는 것.'},
    gap:     {label:'기존 지식과의 차이점',      hint:'① 이 주제에 대해 이미 알려진 것은? ② 이 책은 퍼즐의 어떤 조각을 맞추려 하는가? ③ 그 간극을 메우는 것이 왜 중요한가? · 책에 담긴 사상과 사상가도 함께 적어보세요.'},
    method:  {label:'전개 방식 살펴보기',        hint:'작가가 답을 어떻게 서술하고 찾아가는가? 논거를 쌓는 방식은 설득력이 있는가?'},

    validity:{label:'타당성 확인',              hint:'어떤 과정을 거쳐 나온 주장인가? 근거가 결론을 실제로 지지하는가? 과장은 없는가?'},

    summary: {label:'정리'},

  },
  '논문': {
    stamp:'완료', endLabel:'다 읽은 날 (비우면 ‘읽는 중’)',
    core:    {label:'연구 문제 또는 핵심 질문',  hint:'주로 서론의 끝부분에 있습니다. 이 연구가 답하려는 질문은?'},
    gap:     {label:'기존 지식과의 차이점',      hint:'① 이 주제에 대해 이미 알려진 사실은? ② 이 논문은 퍼즐의 어떤 조각을 맞추려 하는가? ③ 이 간극을 메우는 것이 왜 중요한가?'},
    method:  {label:'연구 방법 평가',            hint:'① 연구 목적에 적합한 도구를 사용했는가? ② 표본 크기가 충분한 통계적 검정력을 확보할 만큼 큰가? ③ 적절한 양성·음성 대조군을 사용했는가? ④ 원시 데이터셋이 공개적으로 접근 가능한가? ⑤ 계산 파이프라인이나 스크립트를 제공했는가?'},
    thoughts:{label:'스스로 결론 도출해보기',    hint:'결과(figure/table)만 보고 내가 내린 결론은? 저자의 결론과 같은가?'},
    validity:{label:'주장 검증',                hint:'저자의 주장이 원시 데이터와 일치하는가? 연구 결과를 과장하지 않았는가?'},
    counter: {label:'반대 입장 취해보기'},
    summary: {label:'정리'},
    group:   {label:'모임에서 나온 의견',        hint:'논문 읽기 모임에서 나온 다른 사람들의 의견'}
  },
  '기타': {
    stamp:'완료', endLabel:'다 읽은 날 (비우면 ‘읽는 중’)',
    core:    {label:'핵심질문과 저자의 답',      hint:'이 글이 답하려는 중심 질문은? 글쓴이는 어떻게 답하는가?'},
    gap:     {label:'기존 지식과의 차이점',      hint:'이미 알려진 것과 이 글이 더하는 것'},
    method:  {label:'전개 방식 살펴보기',        hint:'답을 어떻게 서술하고 찾아가는가?'},
    thoughts:{label:'내 생각',                  hint:''},
    validity:{label:'타당성 확인',              hint:'주장이 근거와 일치하는가? 과장은 없는가?'},
    counter: {label:'반대 입장 취해보기'},
    summary: {label:'정리'},
    group:   {label:'모임에서 나온 의견',        hint:''}
  }
};

let cache = [];        // 내 카드
let publicCache = [];  // 모두의 서재 카드
let nickMap = {};      // user_id → 닉네임
let myNick = null;
let currentUser = null;
let currentId = null;
let currentFilter = 'all';
let tabMode = 'mine';
let rating = 0;

/* ── 질문 항목 폼 만들기 (일반 입력칸으로 순서대로 배치) ── */
function buildDeepSections(){
  const box = document.getElementById('deepSections');
  box.innerHTML = FORM_KEYS.map(k=>`
    <div class="field">
      <label for="f_${k}" id="lbl_${k}"></label>
      <div class="hint" id="hint_${k}"></div>
      <textarea id="f_${k}"></textarea>
    </div>`).join('');
}
function applyTypeLabels(){
  const m = META[document.getElementById('fType').value] || META['기타'];
  FORM_KEYS.forEach(k=>{
    document.getElementById('lbl_'+k).textContent = m[k].label;
    const h = document.getElementById('hint_'+k);
    h.textContent = m[k].hint;
    h.style.display = m[k].hint ? '' : 'none';
  });
  document.getElementById('lblEnd').textContent = m.endLabel;
}

/* ── 입력칸 높이 자동 조절 (내용이 늘면 칸도 늘어남) ── */
function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';
}
document.addEventListener('input', e=>{
  if(e.target.tagName === 'TEXTAREA') autoGrow(e.target);
});

/* ── 인증 ── */
function authMsg(text, ok){
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg ' + (ok ? 'ok' : 'err');
}
async function login(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPw').value;
  if(!email || !password){ authMsg('이메일과 비밀번호를 입력해 주세요.'); return; }
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){
    authMsg(error.message.includes('Invalid') ? '이메일 또는 비밀번호가 올바르지 않습니다.'
          : error.message.includes('confirm') ? '메일함에서 인증 링크를 먼저 눌러주세요.'
          : '로그인 실패: ' + error.message);
  }
}
async function signup(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPw').value;
  if(!email || password.length < 6){ authMsg('이메일과 6자 이상의 비밀번호를 입력해 주세요.'); return; }
  const btn = document.getElementById('signupBtn'); btn.disabled = true;
  const { data, error } = await sb.auth.signUp({ email, password });
  btn.disabled = false;
  if(error){ authMsg('회원가입 실패: ' + error.message); return; }
  if(!data.session) authMsg('가입 메일이 발송되었습니다. 메일함의 인증 링크를 누른 뒤 로그인해 주세요.', true);
}
async function logout(){ await sb.auth.signOut(); }

/* ── 소셜 로그인 ──
   구글/카카오 페이지로 이동했다가 로그인 후 이 사이트로 돌아옵니다.
   돌아오면 onAuthStateChange가 자동으로 감지해 목록 화면을 띄웁니다. */
async function socialLogin(provider){
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: location.origin + location.pathname }
  });
  if(error) authMsg('소셜 로그인 실패: ' + error.message);
}

sb.auth.onAuthStateChange(async (_event, session) => {
  currentUser = session?.user || null;
  document.getElementById('viewAuth').classList.toggle('hidden', !!currentUser);
  document.getElementById('logoutBtn').classList.toggle('hidden', !currentUser);
  if(currentUser){
    await loadNick();
    await fetchCards();
    if(!myNick){ openNick(); } else { showList(); }
  }else{
    cache = []; publicCache = []; myNick = null;
    ['viewList','viewForm','viewDetail','viewNick'].forEach(v=>document.getElementById(v).classList.add('hidden'));
  }
});

/* ── 닉네임 (profiles 테이블) ── */
async function loadNick(){
  const { data } = await sb.from('profiles').select('nickname').eq('id', currentUser.id).maybeSingle();
  myNick = data?.nickname || null;
}
function openNick(){
  document.getElementById('nickInput').value = myNick || '';
  ['viewList','viewForm','viewDetail'].forEach(v=>document.getElementById(v).classList.add('hidden'));
  document.getElementById('viewNick').classList.remove('hidden');
}
async function saveNick(){
  const nickname = document.getElementById('nickInput').value.trim();
  const el = document.getElementById('nickMsg');
  if(!nickname){ el.textContent='닉네임을 입력해 주세요.'; el.className='auth-msg err'; return; }
  const { error } = await sb.from('profiles').upsert({ id: currentUser.id, nickname });
  if(error){ el.textContent='저장 실패: '+error.message; el.className='auth-msg err'; return; }
  myNick = nickname;
  document.getElementById('viewNick').classList.add('hidden');
  showList();
}

/* ── DB 읽기/쓰기 ── */
async function fetchCards(){
  const { data, error } = await sb.from('books')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending:false });
  if(error){ alert('불러오기 실패: ' + error.message); return; }
  cache = data.map(rowToCard);
}
async function fetchPublic(){
  /* RLS 덕분에 이 조회는 "공개(is_public=true)이거나 내 것"인 행만 돌려줍니다 */
  const [{ data: rows, error }, { data: profs }] = await Promise.all([
    sb.from('books').select('*').eq('is_public', true).order('created_at', { ascending:false }),
    sb.from('profiles').select('id,nickname')
  ]);
  if(error){ alert('불러오기 실패: ' + error.message); return; }
  nickMap = Object.fromEntries((profs||[]).map(p=>[p.id, p.nickname]));
  publicCache = rows.map(rowToCard);
}
function rowToCard(r){
  return {
    id:r.id, user_id:r.user_id,
    type:r.item_type||'책',
    title:r.title, author:r.author||'', category:r.category||'',
    start:r.start_date||'', end:r.end_date||'', rating:r.rating||0,
    oneline:r.oneline||'', quotes:r.quotes||[],
    core:r.core_question||'', gap:r.context_gap||'', method:r.method_eval||'',
    thoughts:r.thoughts||'', validity:r.validity_check||'', counter:r.counter_view||'',
    summary:r.summary_note||'', group:r.group_notes||'',
    action:r.action_note||'',          /* 예전 버전 항목 (있으면 상세에서 보여줌) */
    tags:r.tags||[], is_public: r.is_public !== false,
    created_at:r.created_at
  };
}
function cardToRow(c){
  return {
    item_type:c.type||'책',
    title:c.title, author:c.author||null, category:c.category||null,
    start_date:c.start||null, end_date:c.end||null, rating:c.rating||null,
    oneline:c.oneline||null, quotes:c.quotes,
    core_question:c.core||null, context_gap:c.gap||null, method_eval:c.method||null,
    thoughts:c.thoughts||null, validity_check:c.validity||null, counter_view:c.counter||null,
    summary_note:c.summary||null, group_notes:c.group||null,
    tags:c.tags, is_public:c.is_public !== false,
    user_id:currentUser.id
  };
}

/* ── 목록 렌더 ── */
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function stars(n){ return '★'.repeat(n) + '☆'.repeat(5-n); }

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const tf = document.getElementById('typeFilter').value;
  let list = tabMode==='mine' ? [...cache] : [...publicCache];
  if(currentFilter==='done') list = list.filter(c=>c.end);
  if(currentFilter==='reading') list = list.filter(c=>!c.end);
  if(tf) list = list.filter(c=>c.type===tf);
  if(q) list = list.filter(c =>
    (c.title+' '+(c.author||'')+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q));

  const box = document.getElementById('cards');
  box.innerHTML = list.map(c => {
    const stampText = (META[c.type]||META['기타']).stamp;
    const preview = (c.core || c.oneline || '');
    const previewShort = preview.length > 90 ? preview.slice(0,90)+'…' : preview;
    const who = tabMode==='all'
      ? `<span class="who">${esc(nickMap[c.user_id] || '익명')}${c.user_id===currentUser.id?' (나)':''}</span>` : '';
    return `
    <div class="card" onclick="showDetail('${c.id}')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')showDetail('${c.id}')">
      <div class="callno"><span>${esc(c.type)} · ${esc(c.category||'미분류')}</span><span>${esc((c.end||c.start||'').replaceAll('-','.'))}</span></div>
      <h3>${esc(c.title)}</h3>
      <div class="meta">${esc(c.author||'저자 미상')}</div>
      ${c.rating ? `<div class="stars" aria-label="별점 ${c.rating}점">${stars(c.rating)}</div>` : ''}
      ${previewShort ? `<div class="oneline">${esc(previewShort)}</div>` : ''}
      ${who}
      ${c.end ? `<div class="stamp">${stampText}</div>` : ''}
    </div>`;
  }).join('');
  const empty = document.getElementById('emptyMsg');
  empty.classList.toggle('hidden', list.length>0);
  empty.innerHTML = tabMode==='mine'
    ? '아직 카드가 없습니다.<br>「＋ 새 카드」를 눌러 첫 번째 기록을 남겨 보세요.'
    : '아직 공개된 카드가 없습니다.<br>카드를 저장할 때 「모두의 서재에 공개」를 켜면 여기에 나타납니다.';
}

async function switchTab(mode){
  tabMode = mode;
  document.getElementById('tabMine').classList.toggle('on', mode==='mine');
  document.getElementById('tabAll').classList.toggle('on', mode==='all');
  document.getElementById('newBtn').classList.toggle('hidden', mode!=='mine');
  document.getElementById('footerTools').classList.toggle('hidden', mode!=='mine');
  if(mode==='all') await fetchPublic();
  render();
}

/* ── 화면 전환 ── */
function show(id){
  ['viewList','viewForm','viewDetail','viewNick'].forEach(v =>
    document.getElementById(v).classList.toggle('hidden', v!==id));
  window.scrollTo({top:0});
}
function showList(){ currentId=null; show('viewList'); render(); }

/* ── 별점 ── */
function drawRating(){
  const box = document.getElementById('ratingPick');
  box.innerHTML='';
  for(let i=1;i<=5;i++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='★';
    b.className = i<=rating ? 'on':'';
    b.setAttribute('aria-label', i+'점');
    b.onclick=()=>{ rating = (rating===i? 0 : i); drawRating(); };
    box.appendChild(b);
  }
}

/* ── 인용문 행 (여러 줄 입력 가능) ── */
function addQuoteRow(text='', page=''){
  const row=document.createElement('div');
  row.className='quote-item';
  row.innerHTML=`<textarea placeholder="문장을 옮겨 적기" rows="1"></textarea>
                 <input class="pg" placeholder="p." value="${esc(page)}">
                 <button class="ghost" type="button" onclick="this.parentNode.remove()">✕</button>`;
  const ta = row.querySelector('textarea');
  ta.value = text;
  document.getElementById('quoteList').appendChild(row);
  autoGrow(ta);
}

/* ── 작성/수정 ── */
function openForm(id){
  currentId = id || null;
  const c = id ? cache.find(x=>x.id===id) : null;
  document.getElementById('formTitle').textContent = c ? '카드 수정' : '새 카드 작성';
  document.getElementById('fType').value     = c?.type||'책';
  document.getElementById('fTitle').value    = c?.title||'';
  document.getElementById('fAuthor').value   = c?.author||'';
  document.getElementById('fCategory').value = c?.category||'';
  document.getElementById('fStart').value    = c?.start||'';
  document.getElementById('fEnd').value      = c?.end||'';
  document.getElementById('fTags').value     = (c?.tags||[]).join(', ');
  document.getElementById('fPublic').checked = c ? c.is_public : true;
  FORM_KEYS.forEach(k=>{
    document.getElementById('f_'+k).value = c?.[k]||'';
  });
  applyTypeLabels();
  rating = c?.rating||0; drawRating();
  document.getElementById('quoteList').innerHTML='';
  (c?.quotes||[]).forEach(q=>addQuoteRow(q.text,q.page));
  if(!c) addQuoteRow();
  show('viewForm');
  /* 화면에 보이는 상태에서 높이 계산이 정확하므로 표시 후 조절 */
  document.querySelectorAll('#viewForm textarea').forEach(autoGrow);
}

async function saveCard(){
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ alert('제목을 입력해 주세요.'); return; }
  const quotes=[...document.querySelectorAll('#quoteList .quote-item')].map(r=>{
    return {
      text: r.querySelector('textarea').value.trim(),
      page: r.querySelector('.pg').value.trim()
    };
  }).filter(q=>q.text);
  /* 수정 중인 카드의 예전 항목(한 줄 요약·반대 입장·정리)은 지우지 않고 그대로 보존 */
  const prev = currentId ? cache.find(x=>x.id===currentId) : null;
  const card={
    type:     document.getElementById('fType').value,
    title,
    author:   document.getElementById('fAuthor').value.trim(),
    category: document.getElementById('fCategory').value.trim(),
    start:    document.getElementById('fStart').value,
    end:      document.getElementById('fEnd').value,
    rating, quotes,
    oneline:  prev?.oneline||'',
    counter:  prev?.counter||'',
    summary:  prev?.summary||'',
    is_public:document.getElementById('fPublic').checked,
    tags:     document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
  };
  FORM_KEYS.forEach(k=>{ card[k] = document.getElementById('f_'+k).value.trim(); });

  const btn = document.getElementById('saveBtn'); btn.disabled = true;
  let error;
  if(currentId){
    ({ error } = await sb.from('books').update(cardToRow(card)).eq('id', currentId));
  }else{
    ({ error } = await sb.from('books').insert(cardToRow(card)));
  }
  btn.disabled = false;
  if(error){ alert('저장 실패: ' + error.message); return; }
  await fetchCards();
  showList();
}

/* ── 상세 ── */
function showDetail(id){
  currentId=id;
  const c=(tabMode==='mine'?cache:publicCache).find(x=>x.id===id);
  if(!c) return;
  const mine = c.user_id === currentUser.id;
  const m = META[c.type]||META['기타'];
  const period = [c.start, c.end].filter(Boolean).map(d=>d.replaceAll('-','.')).join(' — ') || '';
  const deepHtml = FORM_KEYS
    .filter(k=>c[k])
    .map(k=>`<div class="section-label">${esc(m[k].label)}</div><p>${esc(c[k])}</p>`)
    .join('');
  /* 예전 버전에서 적었던 항목들: 값이 있을 때만 표시 */
  const legacyHtml =
    (c.oneline?`<div class="section-label">한 줄 요약</div><p>${esc(c.oneline)}</p>`:'') +
    (c.counter?`<div class="section-label">${esc(m.counter.label)}</div><p>${esc(c.counter)}</p>`:'') +
    (c.summary?`<div class="section-label">${esc(m.summary.label)}</div><p>${esc(c.summary)}</p>`:'') +
    (c.action?`<div class="section-label">삶에 적용할 것</div><p>${esc(c.action)}</p>`:'');
  document.getElementById('detailBody').innerHTML=`
    <div class="callno" style="font-size:.7rem;letter-spacing:.18em;color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between;">
      <span>${esc(c.type)} · ${esc(c.category||'미분류')}</span><span>${esc(period)}</span>
    </div>
    <h2 style="font-family:var(--serif);font-weight:900;font-size:1.4rem;">${esc(c.title)}</h2>
    <p style="color:var(--ink-soft);margin-top:4px;">${esc(c.author||'저자 미상')}${mine?'':' · <b>'+esc(nickMap[c.user_id]||'익명')+'</b>님의 카드'}</p>
    ${c.rating?`<div class="stars">${stars(c.rating)}</div>`:''}
    ${deepHtml}
    ${legacyHtml}
    ${c.quotes?.length?`<div class="section-label">인상 깊은 문장</div>`+
      c.quotes.map(q=>`<blockquote>${esc(q.text)} ${q.page?`<span class="pg">(p.${esc(q.page)})</span>`:''}</blockquote>`).join(''):''}
    ${c.tags?.length?`<div class="tags">${c.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}
  `;
  document.getElementById('detailActions').classList.toggle('hidden', !mine);
  document.getElementById('detailActionsReadonly').classList.toggle('hidden', mine);
  show('viewDetail');
}

async function deleteCard(){
  if(!confirm('이 카드를 삭제할까요?')) return;
  const { error } = await sb.from('books').delete().eq('id', currentId);
  if(error){ alert('삭제 실패: ' + error.message); return; }
  await fetchCards();
  showList();
}

/* ── 백업 ── */
function exportJSON(){
  const blob=new Blob([JSON.stringify(cache,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='reading-cards-backup.json';
  a.click();
}
async function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const incoming=JSON.parse(r.result);
      if(!Array.isArray(incoming)) throw 0;
      const existing=new Set(cache.map(c=>c.title+'|'+(c.author||'')));
      const rows=incoming
        .filter(c=>c.title && !existing.has(c.title+'|'+(c.author||'')))
        .map(c=>cardToRow(c));
      if(rows.length===0){ alert('추가할 새 기록이 없습니다.'); return; }
      const { error } = await sb.from('books').insert(rows);
      if(error){ alert('가져오기 실패: ' + error.message); return; }
      await fetchCards(); render();
      alert(rows.length+'건을 가져왔습니다. (총 '+cache.length+'건)');
    }catch(e){ alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f);
  ev.target.value='';
}

/* ── 이벤트 ── */
document.getElementById('search').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('filters').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  currentFilter=e.target.dataset.f;
  [...document.querySelectorAll('#filters button')].forEach(b=>b.classList.toggle('on', b===e.target));
  render();
});
document.getElementById('authPw').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });

buildDeepSections();
applyTypeLabels();
</script>
