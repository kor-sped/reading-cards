<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 카드함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF5;        /* 카드 종이 */
    --room:#E7EAE1;         /* 열람실 벽 */
    --ink:#232A21;          /* 짙은 먹색 */
    --ink-soft:#5C6355;     /* 흐린 먹색 */
    --seal:#B0402B;         /* 낙관 도장 빨강 */
    --shelf:#41573F;        /* 서가 초록 */
    --rule:#CDD2C4;         /* 괘선 */
    --serif:'Noto Serif KR', serif;
    --sans:'IBM Plex Sans KR', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--room);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:80px;
  }
  header{
    background:var(--shelf);
    color:var(--paper);
    padding:28px 20px 24px;
    text-align:center;
    border-bottom:4px double rgba(251,250,245,.4);
  }
  header h1{
    font-family:var(--serif); font-weight:900; font-size:1.7rem; letter-spacing:.12em;
  }
  header p{font-size:.82rem; opacity:.75; margin-top:6px; letter-spacing:.05em;}
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px;}

  /* ── 툴바 ── */
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar input[type=search]{
    flex:1; min-width:160px; padding:10px 14px;
    border:1.5px solid var(--rule); border-radius:6px;
    background:var(--paper); font:inherit; font-size:.9rem;
  }
  .toolbar input[type=search]:focus{outline:2px solid var(--shelf); outline-offset:1px;}
  button{
    font:inherit; cursor:pointer; border-radius:6px;
    padding:10px 16px; border:1.5px solid var(--ink);
    background:var(--paper); color:var(--ink); font-weight:600; font-size:.88rem;
    transition:transform .08s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:focus-visible{outline:2px solid var(--seal); outline-offset:2px;}
  button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  button.danger{border-color:var(--seal); color:var(--seal);}
  button.ghost{border-color:var(--rule); color:var(--ink-soft);}

  .filters{display:flex; gap:6px; margin-bottom:16px;}
  .filters button{padding:6px 12px; font-size:.8rem; border-color:var(--rule); color:var(--ink-soft);}
  .filters button.on{background:var(--shelf); color:var(--paper); border-color:var(--shelf);}

  /* ── 카드 목록 ── */
  .cards{display:grid; gap:14px;}
  .card{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:18px 20px 16px;
    position:relative;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(35,42,33,.08), 0 3px 8px rgba(35,42,33,.06);
    background-image:repeating-linear-gradient(transparent, transparent 27px, rgba(205,210,196,.55) 27px, rgba(205,210,196,.55) 28px);
  }
  .card:hover{box-shadow:0 2px 0 rgba(35,42,33,.1), 0 6px 14px rgba(35,42,33,.12);}
  .card .callno{
    font-size:.68rem; letter-spacing:.18em; color:var(--ink-soft);
    text-transform:uppercase; margin-bottom:6px;
    display:flex; justify-content:space-between;
  }
  .card h3{font-family:var(--serif); font-weight:700; font-size:1.12rem; line-height:1.45;}
  .card .meta{font-size:.82rem; color:var(--ink-soft); margin-top:4px;}
  .card .oneline{font-size:.88rem; margin-top:10px; line-height:1.6;}
  .stamp{
    position:absolute; top:14px; right:14px;
    width:52px; height:52px; border:2.5px solid var(--seal); border-radius:50%;
    color:var(--seal); font-family:var(--serif); font-weight:900;
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; letter-spacing:.05em;
    transform:rotate(-12deg); opacity:.85;
    background:rgba(176,64,43,.04);
  }
  .stars{color:var(--seal); letter-spacing:2px; font-size:.85rem; margin-top:6px;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    border:1.5px dashed var(--rule); border-radius:8px; background:rgba(251,250,245,.5);
    line-height:1.8; font-size:.92rem;
  }

  /* ── 폼 / 상세 ── */
  .sheet{
    background:var(--paper); border:1px solid var(--rule); border-radius:4px;
    padding:26px 24px; box-shadow:0 4px 16px rgba(35,42,33,.1);
  }
  .sheet h2{font-family:var(--serif); font-weight:900; font-size:1.25rem; margin-bottom:4px;}
  .sheet .sub{font-size:.8rem; color:var(--ink-soft); margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:.75rem; font-weight:600; letter-spacing:.1em;
    color:var(--shelf); margin-bottom:6px; text-transform:uppercase;
  }
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; font:inherit; font-size:.92rem;
    border:1.5px solid var(--rule); border-radius:6px; background:#fff;
  }
  .field textarea{min-height:88px; resize:vertical; line-height:1.7;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--shelf); outline-offset:1px;}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.row{grid-template-columns:1fr;}}
  .rating-pick{display:flex; gap:6px;}
  .rating-pick button{
    border:none; background:none; font-size:1.5rem; padding:2px;
    color:var(--rule); line-height:1;
  }
  .rating-pick button.on{color:var(--seal);}
  .quote-list{display:grid; gap:8px; margin-bottom:8px;}
  .quote-item{display:flex; gap:8px;}
  .quote-item input{flex:1;}
  .quote-item .pg{width:76px; flex:none;}
  .actions{display:flex; gap:8px; margin-top:22px; flex-wrap:wrap;}

  /* ── 상세 보기 ── */
  .detail blockquote{
    border-left:3px solid var(--seal); padding:6px 0 6px 14px;
    margin:10px 0; font-family:var(--serif); line-height:1.8; font-size:.95rem;
  }
  .detail blockquote .pg{font-size:.75rem; color:var(--ink-soft); font-family:var(--sans);}
  .detail .section-label{
    font-size:.72rem; font-weight:600; letter-spacing:.14em; color:var(--shelf);
    text-transform:uppercase; margin:20px 0 6px; padding-bottom:4px;
    border-bottom:1px solid var(--rule);
  }
  .detail p{line-height:1.8; font-size:.94rem; white-space:pre-wrap;}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tags span{
    font-size:.75rem; padding:3px 10px; border-radius:99px;
    background:rgba(65,87,63,.1); color:var(--shelf); font-weight:500;
  }
  .footer-tools{
    display:flex; gap:8px; justify-content:center; margin-top:32px; flex-wrap:wrap;
  }
  .footer-tools button{font-size:.78rem; padding:7px 12px;}
  .notice{
    text-align:center; font-size:.75rem; color:var(--ink-soft); margin-top:14px; line-height:1.6;
  }
  .hidden{display:none;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <h1>독서 카드함</h1>
  <p>읽고 · 적고 · 남긴다</p>
</header>

<div class="wrap">

  <!-- 목록 화면 -->
  <div id="viewList">
    <div class="toolbar">
      <input type="search" id="search" placeholder="제목·저자·태그 검색" aria-label="검색">
      <button class="primary" onclick="openForm()">＋ 새 카드</button>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="on">전체</button>
      <button data-f="reading">읽는 중</button>
      <button data-f="done">완독</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty hidden" id="emptyMsg">
      아직 카드가 없습니다.<br>「＋ 새 카드」를 눌러 첫 번째 책을 기록해 보세요.
    </div>
    <div class="footer-tools">
      <button class="ghost" onclick="exportJSON()">JSON 내보내기</button>
      <button class="ghost" onclick="document.getElementById('importFile').click()">JSON 가져오기</button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
    </div>
    <p class="notice">기록은 이 브라우저에 저장됩니다. 기기를 바꾸거나 백업하려면 JSON 내보내기를 사용하세요.</p>
  </div>

  <!-- 작성/수정 화면 -->
  <div id="viewForm" class="hidden">
    <div class="sheet">
      <h2 id="formTitle">새 카드 작성</h2>
      <p class="sub">필수 항목은 제목뿐입니다. 나머지는 나중에 채워도 됩니다.</p>

      <div class="field"><label for="fTitle">책 제목 *</label><input id="fTitle" placeholder="예: 데미안"></div>
      <div class="row">
        <div class="field"><label for="fAuthor">저자</label><input id="fAuthor" placeholder="예: 헤르만 헤세"></div>
        <div class="field"><label for="fCategory">분야</label><input id="fCategory" placeholder="예: 소설, 자기계발, 역사"></div>
      </div>
      <div class="row">
        <div class="field"><label for="fStart">읽기 시작</label><input id="fStart" type="date"></div>
        <div class="field"><label for="fEnd">완독일 (비우면 ‘읽는 중’)</label><input id="fEnd" type="date"></div>
      </div>
      <div class="field">
        <label>별점</label>
        <div class="rating-pick" id="ratingPick" role="radiogroup" aria-label="별점"></div>
      </div>
      <div class="field"><label for="fOneline">한 줄 요약</label><input id="fOneline" placeholder="이 책을 한 문장으로 말하면?"></div>
      <div class="field">
        <label>인상 깊은 문장</label>
        <div class="quote-list" id="quoteList"></div>
        <button class="ghost" type="button" onclick="addQuoteRow()">＋ 문장 추가</button>
      </div>
      <div class="field"><label for="fThoughts">내 생각</label><textarea id="fThoughts" placeholder="읽으면서 들었던 생각, 동의하거나 반박하고 싶은 지점"></textarea></div>
      <div class="field"><label for="fAction">삶에 적용할 것</label><textarea id="fAction" placeholder="이 책에서 얻어 실천할 한 가지"></textarea></div>
      <div class="field"><label for="fTags">태그 (쉼표로 구분)</label><input id="fTags" placeholder="예: 성장, 2026, 재독"></div>

      <div class="actions">
        <button class="primary" onclick="saveCard()">저장</button>
        <button class="ghost" onclick="showList()">취소</button>
      </div>
    </div>
  </div>

  <!-- 상세 화면 -->
  <div id="viewDetail" class="hidden">
    <div class="sheet detail" id="detailBody"></div>
    <div class="actions">
      <button onclick="openForm(currentId)">수정</button>
      <button class="danger" onclick="deleteCard()">삭제</button>
      <button class="ghost" onclick="showList()">← 목록으로</button>
    </div>
  </div>

</div>

<script>
/* ── 저장소: localStorage 사용, 안 되면 메모리로 대체 ── */
const KEY = 'readingCards.v1';
let memory = null;
function loadAll(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : (memory || []); }
  catch(e){ return memory || []; }
}
function saveAll(list){
  memory = list;
  try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){}
}

let currentId = null;
let currentFilter = 'all';
let rating = 0;

/* ── 목록 렌더 ── */
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function stars(n){ return '★'.repeat(n) + '☆'.repeat(5-n); }

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = loadAll();
  if(currentFilter==='done') list = list.filter(c=>c.end);
  if(currentFilter==='reading') list = list.filter(c=>!c.end);
  if(q) list = list.filter(c =>
    (c.title+' '+(c.author||'')+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q));
  list.sort((a,b)=> (b.end||b.start||'') > (a.end||a.start||'') ? 1 : -1);

  const box = document.getElementById('cards');
  box.innerHTML = list.map(c => `
    <div class="card" onclick="showDetail('${c.id}')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')showDetail('${c.id}')">
      <div class="callno"><span>${esc(c.category||'미분류')}</span><span>${esc((c.end||c.start||'').replaceAll('-','.'))}</span></div>
      <h3>${esc(c.title)}</h3>
      <div class="meta">${esc(c.author||'저자 미상')}</div>
      ${c.rating ? `<div class="stars" aria-label="별점 ${c.rating}점">${stars(c.rating)}</div>` : ''}
      ${c.oneline ? `<div class="oneline">${esc(c.oneline)}</div>` : ''}
      ${c.end ? `<div class="stamp">완독</div>` : ''}
    </div>`).join('');
  document.getElementById('emptyMsg').classList.toggle('hidden', list.length>0);
}

/* ── 화면 전환 ── */
function show(id){
  ['viewList','viewForm','viewDetail'].forEach(v =>
    document.getElementById(v).classList.toggle('hidden', v!==id));
  window.scrollTo({top:0});
}
function showList(){ currentId=null; show('viewList'); render(); }

/* ── 별점 ── */
function drawRating(){
  const box = document.getElementById('ratingPick');
  box.innerHTML='';
  for(let i=1;i<=5;i++){
    const b=document.createElement('button');
    b.type='button'; b.textContent='★';
    b.className = i<=rating ? 'on':'';
    b.setAttribute('aria-label', i+'점');
    b.onclick=()=>{ rating = (rating===i? 0 : i); drawRating(); };
    box.appendChild(b);
  }
}

/* ── 인용문 행 ── */
function addQuoteRow(text='', page=''){
  const row=document.createElement('div');
  row.className='quote-item';
  row.innerHTML=`<input placeholder="문장을 옮겨 적기" value="${esc(text)}">
                 <input class="pg" placeholder="p." value="${esc(page)}">
                 <button class="ghost" type="button" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById('quoteList').appendChild(row);
}

/* ── 작성/수정 ── */
function openForm(id){
  currentId = id || null;
  const c = id ? loadAll().find(x=>x.id===id) : null;
  document.getElementById('formTitle').textContent = c ? '카드 수정' : '새 카드 작성';
  document.getElementById('fTitle').value    = c?.title||'';
  document.getElementById('fAuthor').value   = c?.author||'';
  document.getElementById('fCategory').value = c?.category||'';
  document.getElementById('fStart').value    = c?.start||'';
  document.getElementById('fEnd').value      = c?.end||'';
  document.getElementById('fOneline').value  = c?.oneline||'';
  document.getElementById('fThoughts').value = c?.thoughts||'';
  document.getElementById('fAction').value   = c?.action||'';
  document.getElementById('fTags').value     = (c?.tags||[]).join(', ');
  rating = c?.rating||0; drawRating();
  document.getElementById('quoteList').innerHTML='';
  (c?.quotes||[]).forEach(q=>addQuoteRow(q.text,q.page));
  if(!c) addQuoteRow();
  show('viewForm');
}

function saveCard(){
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ alert('책 제목을 입력해 주세요.'); return; }
  const quotes=[...document.querySelectorAll('#quoteList .quote-item')].map(r=>{
    const [t,p]=r.querySelectorAll('input');
    return {text:t.value.trim(), page:p.value.trim()};
  }).filter(q=>q.text);
  const card={
    id: currentId || Date.now().toString(36),
    title,
    author:   document.getElementById('fAuthor').value.trim(),
    category: document.getElementById('fCategory').value.trim(),
    start:    document.getElementById('fStart').value,
    end:      document.getElementById('fEnd').value,
    rating, quotes,
    oneline:  document.getElementById('fOneline').value.trim(),
    thoughts: document.getElementById('fThoughts').value.trim(),
    action:   document.getElementById('fAction').value.trim(),
    tags:     document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean),
  };
  let list=loadAll();
  const i=list.findIndex(x=>x.id===card.id);
  if(i>=0) list[i]=card; else list.push(card);
  saveAll(list);
  showList();
}

/* ── 상세 ── */
function showDetail(id){
  currentId=id;
  const c=loadAll().find(x=>x.id===id);
  if(!c) return;
  const period = [c.start, c.end].filter(Boolean).map(d=>d.replaceAll('-','.')).join(' — ') || '';
  document.getElementById('detailBody').innerHTML=`
    <div class="callno" style="font-size:.7rem;letter-spacing:.18em;color:var(--ink-soft);margin-bottom:8px;display:flex;justify-content:space-between;">
      <span>${esc(c.category||'미분류')}</span><span>${esc(period)}</span>
    </div>
    <h2 style="font-family:var(--serif);font-weight:900;font-size:1.4rem;">${esc(c.title)}</h2>
    <p style="color:var(--ink-soft);margin-top:4px;">${esc(c.author||'저자 미상')}</p>
    ${c.rating?`<div class="stars">${stars(c.rating)}</div>`:''}
    ${c.oneline?`<div class="section-label">한 줄 요약</div><p>${esc(c.oneline)}</p>`:''}
    ${c.quotes?.length?`<div class="section-label">인상 깊은 문장</div>`+
      c.quotes.map(q=>`<blockquote>${esc(q.text)} ${q.page?`<span class="pg">(p.${esc(q.page)})</span>`:''}</blockquote>`).join(''):''}
    ${c.thoughts?`<div class="section-label">내 생각</div><p>${esc(c.thoughts)}</p>`:''}
    ${c.action?`<div class="section-label">삶에 적용할 것</div><p>${esc(c.action)}</p>`:''}
    ${c.tags?.length?`<div class="tags">${c.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}
  `;
  show('viewDetail');
}

function deleteCard(){
  if(!confirm('이 카드를 삭제할까요?')) return;
  saveAll(loadAll().filter(x=>x.id!==currentId));
  showList();
}

/* ── 백업 ── */
function exportJSON(){
  const blob=new Blob([JSON.stringify(loadAll(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='reading-cards-backup.json';
  a.click();
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const incoming=JSON.parse(r.result);
      if(!Array.isArray(incoming)) throw 0;
      const list=loadAll();
      incoming.forEach(c=>{ if(c.id && !list.some(x=>x.id===c.id)) list.push(c); });
      saveAll(list); render();
      alert('가져오기 완료: 총 '+list.length+'권');
    }catch(e){ alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f);
  ev.target.value='';
}

/* ── 이벤트 ── */
document.getElementById('search').addEventListener('input', render);
document.getElementById('filters').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  currentFilter=e.target.dataset.f;
  [...document.querySelectorAll('#filters button')].forEach(b=>b.classList.toggle('on', b===e.target));
  render();
});

render();
</script>
</body>
</html>
